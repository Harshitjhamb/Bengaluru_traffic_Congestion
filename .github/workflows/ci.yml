name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (syntax + import errors)
        run: |
          python -m py_compile app/app_v2.py notebook/train_v2.py

      - name: Smoke test — bundle loads and recommend_resources runs
        run: |
          python - <<'EOF'
          import joblib
          bundle = joblib.load('models/recommendation_engine_bundle_v2.pkl')
          for key in ['priority_model', 'closure_model', 'duration_model', 'hotspots']:
              assert key in bundle, f"missing bundle key: {key}"
          print("Bundle OK — keys:", sorted(bundle.keys()))

          src = open('app/app_v2.py').read().split('# ---------------- UI ----------------')[0]
          ns = {}
          exec(compile(src, 'app_v2.py', 'exec'), ns)
          result = ns['recommend_resources']({
              'event_type': 'unplanned', 'event_cause': 'vehicle_breakdown',
              'latitude': 12.9716, 'longitude': 77.5946, 'hour': 9,
              'day_of_week': 1, 'month_num': 3, 'zone': 'Unknown',
          })
          assert result['predicted_priority'] in ('High', 'Low')
          print("recommend_resources() OK:", result)
          EOF
